name: Update macro time series from ugatsdb

on:
  schedule:
    # ugatsdb itself is only updated once a month, so no point running more often
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of every month
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  update-macro-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.0"

      - name: Install dependencies
        run: Rscript -e 'install.packages(c("ugatsdb","jsonlite"), repos="https://cloud.r-project.org")'

      - name: Fetch latest series
        run: Rscript scripts/fetch_macro_timeseries.R

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/macro_timeseries.json
          git diff --cached --quiet || git commit -m "Auto-update macro time series from ugatsdb"
          git push
